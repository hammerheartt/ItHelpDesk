services:
  mysql:
    image: mysql:8.4
    container_name: helpdesk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: helpdesk
    ports:
      - "3307:3306"
    volumes:
      - helpdesk-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: ItHelpDesk.Api/Dockerfile
    container_name: helpdesk-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ItHelpDesk: "Server=mysql;Port=3306;Database=helpdesk;User=root;Password=root;"
    ports:
      - "5157:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  helpdesk-mysql-data: